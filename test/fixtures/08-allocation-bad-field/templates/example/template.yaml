# yaml-language-server: $schema=../../schema/template.schema.json
schema: 1
match:
  modrinth:
    project_id: AAAAAAAA
meta:
  enabled: true
  maintainer: "test"
  tested_with: "1.0"
options:
  - { key: p, type: allocation, label: P, protocol: udp, mode: create }
steps:
  - action: install
    target: main
  - action: allocate
    option: p
  - action: command
    command: "say {{ options.p.host }}"
uninstall:
  - action: release
    option: p
