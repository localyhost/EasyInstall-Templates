name: Validate templates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - name: Index up to date?
        run: |
          npm run build
          if ! git diff --exit-code dist/index.json; then
            echo "::error file=dist/index.json::Index is outdated, run \`npm run build\` and commit dist/index.json."
            exit 1
          fi
