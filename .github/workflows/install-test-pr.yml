name: Install test (PR)

# Installs every template changed in the PR on a real Paper server.
on:
  pull_request:
    paths:
      - "templates/**"
      - "tools/**"
      - "schema/**"

permissions:
  contents: read

jobs:
  install-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/cache@v6
        with:
          path: test-results/cache
          key: paper-${{ runner.os }}-${{ github.run_id }}
          restore-keys: paper-${{ runner.os }}-
      - run: npm ci

      - name: Find changed templates
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          # Changed test code → test all templates, otherwise only the changed ones.
          if git diff --name-only "$base" HEAD | grep -qE '^(tools|schema)/'; then
            ids=""
          else
            ids=$(git diff --name-only "$base" HEAD -- templates \
              | cut -d/ -f2 | grep -v '^_' | sort -u \
              | while read -r id; do [ -f "templates/$id/template.yaml" ] && echo "$id"; done | xargs)
            [ -z "$ids" ] && echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "Templates: ${ids:-all enabled}"

      - name: Install test
        if: steps.changed.outputs.skip != 'true'
        run: npm run test-install -- ${{ steps.changed.outputs.ids }} --json test-results/report.json

      - name: Upload logs
        if: always() && steps.changed.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: install-test-logs
          path: |
            test-results/*.log
            test-results/report.json
          if-no-files-found: ignore
